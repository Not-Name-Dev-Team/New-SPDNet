server:
  port: 42910
spring:
  datasource:
    url: jdbc:sqlite:SPDNetData.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
spd:
  version: 3.3.8
  netVersion: 0.1.1
  motd: 不欢迎  >:^(
  bannedWordsFile: banned_words.txt
  # SPDNet: 管理员接口(JWT)访问令牌配置
  jwt:
    # 签名密钥（HS256 建议 >= 32 字节）。
    # 该项目会发布到开源环境，密钥不硬编码进源码，请通过环境变量 SPD_JWT_SECRET 注入；
    # 未配置时运行时会使用随机密钥兜底（重启后旧令牌失效）。
    secret: ${SPD_JWT_SECRET:}
    # 令牌有效期（天）
    expireDays: 1
  cors:
    # SPDNet: 跨域来源白名单(逗号分隔)。生产环境前端由后端同源托管，通常无需跨域；
    # 如需允许其他站点跨域，请在此补充其来源地址。
    allowedOrigins: http://localhost:3000,http://127.0.0.1:3000
  mail:
    # 是否启用邮件功能
    enabled: true
    # SMTP 服务器地址 (126邮箱)
    host: smtp.126.com
    # SMTP 端口 (126邮箱使用SSL端口465)
    port: 465
    # 邮箱账号
    username: JDSALing@126.com
    # 邮箱授权码 (注意：不是登录密码，是SMTP授权码)
    password: HJOHDUYCGDQOZYMH
    # 发件人邮箱
    from: JDSALing@126.com
    # 发件人名称
    fromName: SPDNet
    # 验证码过期时间（分钟）
    codeExpireMinutes: 5
    # 验证码长度
    codeLength: 6
